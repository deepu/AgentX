name: letter-approved
description: Staff ask for a letter, the agent drafts it, the partner approves it and the engagement is recorded.
case: {}
submit:
  request:
    outcome: submitted
    values:
      client_name: Asha Rao
      client_email: asha@acme-traders.example
      scope: Statutory audit of the accounts for FY 2026-27
      fee: { amount: 250000, currency: INR }
      start_date: 2026-11-01
  partner_review: { outcome: approved }
model:
  drafter:
    - toolCalls:
        - name: step.finish
          args:
            outcome: drafted
            writes:
              engagement_title: Statutory audit FY 2026-27
              letter: >-
                Dear Asha Rao, we will audit the accounts of Acme Traders for FY 2026-27 from
                1 November 2026, for a fee of INR 2,50,000 billed on completion.
            rationale: The letter states the scope, the fee and the start date from the request.
expect:
  outcome: submitted
  state: end
  writes: { engagement_title: Statutory audit FY 2026-27 }
  effects: { domain.engagement.create: 1 }
  entities:
    Engagement:
      - { title: Statutory audit FY 2026-27 }
