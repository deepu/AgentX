name: Validate Kernel

on:
  pull_request:
  push:
    branches:
      - main
      - new-primitives
  workflow_dispatch:

concurrency:
  group: validate-kernel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck kernel packages
        run: bun run typecheck:memwise

      # Tests start their own throwaway Postgres 18 from the bundled embedded-postgres binaries.
      - name: Kernel tests (crash-and-resume included)
        run: bun run test:kernel

      - name: Check and test the sample project
        run: |
          bun run memwise check examples/intake
          bun run memwise test examples/intake
