name: Spike S3 · Bundled Postgres

# Throwaway spike (docs/memwise/17-build-plan.md, Phase 0, S3): measures the
# bundled Postgres binaries and PGlite on each desktop OS, under Node and Bun.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'spikes/s3-bundled-postgres/**'
      - '.github/workflows/spike-s3-postgres.yml'

concurrency:
  group: spike-s3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: spikes/s3-bundled-postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install (npm, spike is outside the Bun workspaces)
        run: npm ci --no-audit --no-fund

      - name: Measure under Node
        id: node
        run: |
          set -o pipefail
          node measure.mjs | tee node.txt
          { echo "### ${{ matrix.os }} · Node"; echo '```'; cat node.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Measure under Bun
        if: always() && steps.node.conclusion != 'skipped'
        run: |
          set -o pipefail
          SKIP_REGISTRY=1 bun measure.mjs | tee bun.txt
          { echo "### ${{ matrix.os }} · Bun"; echo '```'; cat bun.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Postgres log on failure
        if: failure()
        run: tail -n 50 ~/.memwise/spike-s3/*/postgres.log || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-s3-${{ matrix.os }}
          path: |
            spikes/s3-bundled-postgres/results/
            spikes/s3-bundled-postgres/*.txt
          if-no-files-found: ignore
