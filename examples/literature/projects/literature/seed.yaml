# Walkthrough records for the Literature search project (26 §3): made once, when it has none
# (kernel.projects.seed). One watched topic and two papers it found, one read.
records:
  topic:
    entity: Topic
    status: active
    values:
      name: Oral GLP-1s for weight in T2D
      question: How much weight do people with type 2 diabetes lose on oral GLP-1 receptor agonists, compared with placebo?
      query: '("orforglipron"[tiab] OR "oral semaglutide"[tiab]) AND "type 2 diabetes"[tiab] AND randomized controlled trial[pt]'
      inclusion: Adults with type 2 diabetes; an oral GLP-1 receptor agonist against placebo; bodyweight change; randomised trials only.
      next_check: "2026-10-26"
  attain2:
    entity: Article
    status: read
    values:
      pmid: "40000001"
      title: Orforglipron versus placebo in adults with obesity and type 2 diabetes (ATTAIN-2)
      journal: The Lancet
      year: 2026
      study_type: randomised_trial
      phase: phase_3
      n: 1613
      intervention: Orforglipron
      condition: Obesity and type 2 diabetes
      abstract: In adults with obesity and type 2 diabetes, orforglipron 36 mg reduced bodyweight by 10·5% at week 72 compared with 2·2% with placebo.
  pioneer:
    entity: Article
    values:
      pmid: "40000002"
      title: Oral semaglutide and bodyweight in type 2 diabetes, a pooled analysis
      journal: Diabetes Care
      year: 2025
