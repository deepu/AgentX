domain: literature
name: Literature
description: "Ask what the published literature says. Each question becomes a page; keep the ones that matter and they refresh from PubMed every week, with every change to the answer reviewed. Papers are read once into Papers; doctors' enquiries are answered from the pages first."
owner: lead                    # flags, held automations and triggered cases go to the medical affairs lead
home:                          # no entity: a question makes a draft page (26 §4)
  ask: What do you want to know from the literature?
  placeholder: Ask a question the evidence can answer
  suggested:
    - How often do people stop oral GLP-1s because of side effects?
    - Does weight come back after switching from injections to a pill?
    - How much weight do adults with type 2 diabetes lose on oral GLP-1 receptor agonists, compared with placebo?
    - Do SGLT2 inhibitors reduce heart failure hospitalisation in people without diabetes?
pages:                         # kept pages refresh with the Literature's own "Refresh a page"
  refresh: refresh-literature-page
  reviewer: lead               # the lead reviews answer changes, besides whoever kept the page
  every: mon
intake: { address: enquiries } # doctors' questions emailed in start "Answer an enquiry"
