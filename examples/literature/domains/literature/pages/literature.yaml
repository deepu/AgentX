title: Literature
description: The papers read into Papers and the doctors' enquiries, with what is waiting for the medical lead.
blocks:
  - kpi:
      label: Papers
      value: { count: Article }
  - kpi:
      label: Papers read
      value: { count: Article, where: "status = 'read'" }
  - kpi:
      label: Enquiries open
      value: { count: Enquiry, where: "status != 'sent'" }
  - chart: { kind: bar, entity: Article, where: "status = 'read'", by: year, title: Papers read by year }
  - chart: { kind: donut, entity: Article, where: "status = 'read'", by: phase, title: Papers read by trial phase }
  - text: |
      Papers come from PubMed when a kept page refreshes, and each is read once whichever page found
      it. The answers themselves live on the pages: ask a question on the Literature home and keep
      the page to have it refreshed every week.
