title: Literature
description: Every topic's papers and the evidence kept from them, and what is waiting for a reviewer.
blocks:
  - kpi:
      label: Topics watched
      value: { count: Topic, where: "status = 'active'" }
  - kpi:
      label: Papers read
      value: { count: Article, where: "status = 'read'" }
  - kpi:
      label: Papers included
      value: { count: Screening, where: "decision = 'include'" }
  - kpi:
      label: Evidence to review
      value: { count: Evidence, where: "status = 'kept'" }
  - chart: { kind: bar, entity: Screening, where: "decision = 'include'", by: year, title: Included papers by year }
  - chart: { kind: donut, entity: Screening, where: "decision = 'include'", by: phase, title: Included papers by trial phase }
  - chart:
      kind: interval
      entity: Evidence
      where: "status != 'rejected'"
      label: "{intervention} vs {comparator}"
      value: effect
      low: ci_low
      high: ci_high
      title: Effects kept as evidence
  - table:
      title: Evidence to review
      view: evidence-to-review
  - text: |
      Papers come from PubMed, searched once a week per topic. Cite them with their DOI links.
      To ask what a topic's papers say, open the topic and choose "Ask about this topic"; findings
      kept from the chat wait here until a reviewer checks them against the paper.
