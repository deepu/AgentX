entity: Evidence
title: "{outcome}: {intervention} vs {comparator}"
parent: topic
keep_from_chat: true           # "Keep as evidence" in a chat about a topic
fields:
  topic:        { type: Ref<Topic>, required: true }
  article:      { type: Ref<Article>, required: true }
  population:   Text
  intervention: { type: Text, description: "Like Orforglipron 36 mg" }
  comparator:   { type: Text, description: "Like Placebo" }
  outcome:      { type: Text, description: "Like Percent change in bodyweight" }
  timepoint:    { type: Text, description: "Like Week 72" }
  effect:       { type: Number, description: "The estimate, like the treatment difference" }
  ci_low:       { type: Number, description: The lower end of its 95% confidence interval }
  ci_high:      { type: Number, description: The upper end of its 95% confidence interval }
  unit:         { type: Text, description: "Like percentage points" }
  p_value:      { type: Text, description: "As the paper writes it, like p<0·0001" }
  quote:        { type: Text, quote_of: article.abstract, description: "The paper's words the finding was read from, exactly" }
lifecycle:
  initial: kept
  states:
    kept:     { on: { review: reviewed, reject: rejected }, description: "Kept from a chat or a step; not checked yet" }
    reviewed: { description: A reviewer checked it against the paper }
    rejected: { description: "Wrong or not useful; left out of the charts" }
  transitions:
    review: { by: [role:reviewer] }
    reject: { by: [role:reviewer] }
page:
  layout: split
  header: [title, status, topic]
  left:  [{ fields: [population, intervention, comparator, outcome, timepoint, effect, ci_low, ci_high, unit, p_value, quote] }]
  right: [lifecycle, details]
  below: [notes, history]
