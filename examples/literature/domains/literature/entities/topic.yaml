entity: Topic
title: "{name}"
list: [next_check, last_checked, included, excluded, evidence_kept, status]
fields:
  name:         { type: Text, required: true, description: "A short name, like Oral GLP-1s for weight in T2D" }
  question:     { type: Text, required: true, description: "The question the team wants answered, in plain words" }
  query:        { type: Text, description: "The PubMed search that answers it, in PubMed syntax" }
  inclusion:    { type: Text, description: "Which papers count: the population, intervention, comparator, outcomes and study types to include" }
  last_checked: { type: DateTime, description: When PubMed was last searched for this topic }
  next_check:   { type: Date, description: "The next weekly search; set it to today to check now" }
relationships:
  screenings: many Screening
  evidence:   many Evidence
calculated:
  included:          { count: screenings, where: "decision = 'include'", description: Papers a reviewer included }
  excluded:          { count: screenings, where: "decision = 'exclude'", description: Papers a reviewer excluded }
  evidence_kept:     { count: evidence, where: "status = 'kept'", description: Findings kept and waiting for review }
  evidence_reviewed: { count: evidence, where: "status = 'reviewed'", description: Findings a reviewer checked against the paper }
lifecycle:
  initial: draft
  states:
    draft:  { on: { activate: active, close: closed }, description: "Waiting for its search to be approved" }
    active: { on: { pause: paused, close: closed }, description: Searched every week }
    paused: { on: { resume: active, close: closed }, description: Not searched until resumed }
    closed: { description: The question is answered or dropped; read only }
  transitions:
    activate: { by: [step] }
    pause:    { by: [role:lead] }
    resume:   { by: [role:lead] }
    close:    { by: [role:lead] }
page:
  layout: sidebar
  header: [title, status, next_check]
  main:
    - kpis: [included, excluded, evidence_kept, evidence_reviewed]
    - chart: { kind: bar, of: screenings, by: year, where: "decision = 'include'", title: Included papers by year }
    - chart: { kind: interval, of: evidence, label: "{intervention} vs {comparator}", value: effect, low: ci_low, high: ci_high, unit: unit, where: "status != 'rejected'", title: Effect vs comparator }
    - related: [evidence, screenings]
    - cases
  side: [details, lifecycle, start, chat]
  below: [notes, history]
