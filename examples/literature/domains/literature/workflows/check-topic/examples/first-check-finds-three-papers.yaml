name: first-check-finds-three-papers
description: >
  The first weekly check of "Oral GLP-1s for weight in T2D". PubMed finds three papers. All three
  were stored and read last week by the topic "Orforglipron, all indications", so storing them again
  gives back the same records and none is read twice. The screener suggests including ATTAIN-2 and
  Example Trial A and excluding Example Review B (a review); the reviewer agrees, three screenings
  are recorded and the next check is set for a week later.
records:
  Topic:
    - id: topi_glp1_weight
      name: Oral GLP-1s for weight in T2D
      question: How much weight do adults with type 2 diabetes lose on oral GLP-1 receptor agonists, compared with placebo?
      query: '(orforglipron OR "oral semaglutide" OR "oral GLP-1") AND ("type 2 diabetes" OR "diabetes mellitus, type 2"[MeSH Terms]) AND (obesity OR weight)'
      inclusion: Include randomised trials in adults with type 2 diabetes and overweight or obesity that compare an oral GLP-1 receptor agonist with placebo or another treatment and report the change in bodyweight. Exclude reviews, animal and laboratory studies, injectable GLP-1s, and trials without a weight outcome.
      next_check: "2026-10-21"
      status: active
  Article:
    - id: arti_attain2
      pmid: "41275875"
      doi: 10.1016/S0140-6736(25)02165-8
      title: "Orforglipron, an oral small-molecule GLP-1 receptor agonist, for the treatment of obesity in people with type 2 diabetes (ATTAIN-2): a phase 3, double-blind, randomised, multicentre, placebo-controlled trial."
      journal: Lancet
      published: "2025-11-20"
      year: 2025
      study_type: randomised_trial
      phase: phase_3
      n: 1613
      sponsor: Eli Lilly and Company
      intervention: Orforglipron 6 mg, 12 mg or 36 mg once daily, by mouth
      condition: Obesity in adults with type 2 diabetes
      status: read
    - id: arti_trial_a
      pmid: "99000001"
      doi: 10.0000/example.trial-a
      pmc_id: PMC99000001
      title: "Example Trial A: once-daily oral semaglutide 50 mg for weight management in adults with type 2 diabetes and overweight or obesity: a randomised, double-blind, placebo-controlled, phase 3 trial."
      journal: Ex J Diabetes Obes
      published: "2025-06-12"
      year: 2025
      study_type: randomised_trial
      phase: phase_3
      n: 412
      sponsor: Example Pharma
      intervention: Oral semaglutide 50 mg once daily
      condition: Type 2 diabetes with overweight or obesity
      status: read
    - id: arti_review_b
      pmid: "99000002"
      doi: 10.0000/example.review-b
      title: "Example Review B: oral GLP-1 receptor agonists for obesity in people with type 2 diabetes, a narrative review."
      journal: Ex Rev Endocrinol
      published: "2026-01-08"
      year: 2026
      study_type: review
      status: read
