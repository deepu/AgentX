workflow: read-paper
version: 1
title: Read a paper
owner: lead
# Called by "Check a topic" for each new paper. Each paper is read once, whichever topic found it:
# a paper already read ends here at once; otherwise its facts go onto the Article with the words
# they were read from.
start: status
steps:
  status:                                            # read before (by another topic's check): nothing to do
    on: { found: extract, read: end }
  extract:
    on: { extracted: save }
  save:    { on: { done: end } }
