workflow: read-paper
version: 1
title: Read a paper
owner: lead
# Called by the Literature's "Refresh a page" for each new paper. Each paper is read once,
# whichever page's refresh found it: a paper already read ends here at once; otherwise its facts go
# onto the Article with the words they were read from.
start: status
steps:
  status:                                            # read before (by another page's refresh): nothing to do
    on: { found: extract, read: end }
  extract:
    on: { extracted: save }
  save:    { on: { done: end } }
