workflow: set-up-watch
version: 2
title: Set up a watch
owner: lead
# Starts when someone chooses "Keep watching" on a topic (it becomes active). The chat that answered
# its question already wrote the search; this sets the next weekly check a week out and starts the
# first check now ("Check a topic" writes a search itself when a topic has none).
start: activate
starts_on:
  - entered: Topic.active
    with: { topic: record }
steps:
  activate: { on: { done: first_check } }
  first_check:
    start: { workflow: check-topic, with: { topic: case.topic } }
    on: { started: end }
