name: lead-approves
description: >
  The lead creates the topic "Oral GLP-1s for weight in T2D". The searcher drafts a PubMed search
  for oral GLP-1 receptor agonists and weight in type 2 diabetes, tries it (three papers today,
  ATTAIN-2 among them) and writes the inclusion rules; the lead approves it, and the topic is
  active with its first check due today.
records:
  Topic:
    - id: topi_glp1_weight
      name: Oral GLP-1s for weight in T2D
      question: How much weight do adults with type 2 diabetes lose on oral GLP-1 receptor agonists, compared with placebo?
      status: draft
case:
  topic: topi_glp1_weight
tools:
  PubMed.search_articles:
    pmids: ["99000002", "41275875", "99000001"]
    total_count: 3
    returned_count: 3
    query: '(orforglipron OR "oral semaglutide" OR "oral GLP-1") AND ("type 2 diabetes" OR "diabetes mellitus, type 2"[MeSH Terms]) AND (obesity OR weight)'
    query_translation: '(orforglipron OR "oral semaglutide"[All Fields] OR "oral GLP-1"[All Fields]) AND ("type 2 diabetes"[All Fields] OR "diabetes mellitus, type 2"[MeSH Terms]) AND (obesity OR weight)'
    has_more: false
  PubMed.get_article_metadata:
    count: 3
    articles:
      - identifiers: { pmid: "99000002", doi: 10.0000/example.review-b }
        title: "Example Review B: oral GLP-1 receptor agonists for obesity in people with type 2 diabetes, a narrative review."
        journal: { title: Example Reviews in Endocrinology, iso_abbreviation: Ex Rev Endocrinol }
        publication_date: { year: "2026", month: "01", day: "08" }
        article_types: [Journal Article, Review]
      - identifiers: { pmid: "41275875", doi: 10.1016/S0140-6736(25)02165-8 }
        title: "Orforglipron, an oral small-molecule GLP-1 receptor agonist, for the treatment of obesity in people with type 2 diabetes (ATTAIN-2): a phase 3, double-blind, randomised, multicentre, placebo-controlled trial."
        journal: { title: "Lancet (London, England)", iso_abbreviation: Lancet }
        publication_date: { year: "2025", month: "11", day: "20" }
        article_types: [Journal Article, Randomized Controlled Trial, Multicenter Study, "Clinical Trial, Phase III"]
      - identifiers: { pmid: "99000001", doi: 10.0000/example.trial-a, pmc: PMC99000001 }
        title: "Example Trial A: once-daily oral semaglutide 50 mg for weight management in adults with type 2 diabetes and overweight or obesity: a randomised, double-blind, placebo-controlled, phase 3 trial."
        journal: { title: Example Journal of Diabetes and Obesity, iso_abbreviation: Ex J Diabetes Obes }
        publication_date: { year: "2025", month: "06", day: "12" }
        article_types: [Journal Article, Randomized Controlled Trial, "Clinical Trial, Phase III"]
model:
  searcher:
    - toolCalls:
        - { name: literature.topic.get, args: { id: topi_glp1_weight } }
    - toolCalls:
        - name: PubMed.search_articles
          args:
            query: '(orforglipron OR "oral semaglutide" OR "oral GLP-1") AND ("type 2 diabetes" OR "diabetes mellitus, type 2"[MeSH Terms]) AND (obesity OR weight)'
            max_results: 20
    - toolCalls:
        - { name: PubMed.get_article_metadata, args: { pmids: ["99000002", "41275875", "99000001"] } }
    - toolCalls:
        - name: step.finish
          args:
            outcome: drafted
            writes:
              query: '(orforglipron OR "oral semaglutide" OR "oral GLP-1") AND ("type 2 diabetes" OR "diabetes mellitus, type 2"[MeSH Terms]) AND (obesity OR weight)'
              inclusion: >-
                Include randomised trials in adults with type 2 diabetes and overweight or obesity
                that compare an oral GLP-1 receptor agonist with placebo or another treatment and
                report the change in bodyweight. Exclude reviews, animal and laboratory studies,
                injectable GLP-1s, and trials without a weight outcome.
              found_count: 3
              sample:
                - { pmid: "99000002", title: "Example Review B: oral GLP-1 receptor agonists for obesity in people with type 2 diabetes, a narrative review.", year: 2026 }
                - { pmid: "41275875", title: "Orforglipron, an oral small-molecule GLP-1 receptor agonist, for the treatment of obesity in people with type 2 diabetes (ATTAIN-2): a phase 3, double-blind, randomised, multicentre, placebo-controlled trial.", year: 2025 }
                - { pmid: "99000001", title: "Example Trial A: once-daily oral semaglutide 50 mg for weight management in adults with type 2 diabetes and overweight or obesity: a randomised, double-blind, placebo-controlled, phase 3 trial.", year: 2025 }
            rationale: >
              The two oral GLP-1 receptor agonists by name and the class, with type 2 diabetes
              (also as MeSH) and obesity or weight. It finds three papers today, one of them the
              phase 3 trial ATTAIN-2.
submit:
  approve_query: { outcome: approved }
expect:
  outcome: drafted
  state: end
  writes: { found_count: 3 }
  effects: { literature.topic.update: 1, literature.topic.transition: 1 }
  entities:
    Topic:
      - { name: Oral GLP-1s for weight in T2D, query: '(orforglipron OR "oral semaglutide" OR "oral GLP-1") AND ("type 2 diabetes" OR "diabetes mellitus, type 2"[MeSH Terms]) AND (obesity OR weight)' }
