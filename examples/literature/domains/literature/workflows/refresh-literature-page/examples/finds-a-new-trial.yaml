name: finds-a-new-trial
description: >
  Monday's refresh of "Weight loss" (under GLP-1). PubMed added ATTAIN-MAINTAIN since the page last
  refreshed; it was stored in Papers last week by another page's refresh but not read yet, so
  storing it again gives back the same record. "Read a paper" reads it, the writer adds a section
  on keeping weight off after switching from injections, the compare step finds the answer changed,
  and the medical affairs lead accepts the change.
records:
  Article:
    - id: arti_attain_maintain
      pmid: "99001020"
      doi: 10.1038/s41591-026-04386-7
      title: "Orforglipron for weight maintenance after switching from injectable incretin therapy (ATTAIN-MAINTAIN): a randomised, double-blind, placebo-controlled, phase 3 trial."
      journal: Nat Med
      published: "2026-05-27"
      year: 2026
      article_types: [Journal Article, Randomized Controlled Trial, "Clinical Trial, Phase III"]
      authors: Aronne LJ, Horn DB, le Roux CW, et al.
      abstract: >-
        ATTAIN-MAINTAIN was a 52-week, phase 3, randomised, double-blind, placebo-controlled trial of
        once-daily oral orforglipron for weight maintenance in adults with obesity who had reached a
        body weight plateau on weekly injectable incretin therapy. In all, 376 participants who had lost
        weight on tirzepatide (n=205) or semaglutide (n=171) were randomly assigned to switch to
        orforglipron or placebo. Cohort 1 participants who achieved body weight plateau maintained a model-based
        estimate (MBE) of 74.7% (s.e.m. 4.05) of body weight reduction with orforglipron compared with
        an MBE of 49.2% (s.e.m. 3.92) with placebo. In cohort 2, 79.3% of the weight lost on
        semaglutide was maintained with orforglipron versus 37.6% with placebo. Eli Lilly and Company.
      status: found
