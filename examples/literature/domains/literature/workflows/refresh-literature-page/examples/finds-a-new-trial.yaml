  page.compare: { outcome: material, change: pch_attain_maintain }
  page.accept_change: { page: page_weight_loss, version: 5 }
model:
  searcher:
    - toolCalls:
        - { name: page.get, args: { page: page_weight_loss } }
    - toolCalls:
        - { name: PubMed.search_articles, args: { query: (orforglipron OR "oral semaglutide") AND (weight OR obesity), datetype: edat, date_from: 2026/05/25, max_results: 50 } }
    - toolCalls:
        - { name: PubMed.get_article_metadata, args: { pmids: ["99001020"] } }
    - toolCalls:
        - name: literature.article.create
          args: { pmid: "99001020", doi: 10.1038/s41591-026-04386-7, title: "Orforglipron for weight maintenance after switching from injectable incretin therapy (ATTAIN-MAINTAIN): a randomised, double-blind, placebo-controlled, phase 3 trial.", journal: Nat Med, published: "2026-05-27", year: 2026, article_types: [Journal Article, Randomized Controlled Trial, "Clinical Trial, Phase III"], authors: "Aronne LJ, Horn DB, le Roux CW, et al." }
    - toolCalls:
        - name: step.finish
          args:
            outcome: found
            writes: { query: (orforglipron OR "oral semaglutide") AND (weight OR obesity), searched_from: 2026/05/25, found_count: 1, new_articles: [arti_attain_maintain] }
            rationale: One paper added since the last refresh on 25 May; it is stored but not read yet.
  extractor:
    - toolCalls:
        - { name: literature.article.get, args: { id: arti_attain_maintain } }
    - toolCalls:
        - name: step.finish
          args:
            outcome: extracted
            writes: { study_type: randomised_trial, phase: phase_3, n: 376, sponsor: Eli Lilly and Company, intervention: Orforglipron once daily by mouth after weekly injections, condition: Obesity after weight loss on injectable incretins }
            quotes:
              study_type: randomly assigned to switch to orforglipron or placebo
              phase: 52-week, phase 3, randomised, double-blind, placebo-controlled trial
              n: 376 participants who had lost weight
              sponsor: Eli Lilly and Company.
              intervention: once-daily oral orforglipron for weight maintenance
              condition: adults with obesity who had reached a body weight plateau on weekly injectable incretin therapy
            rationale: A randomised phase 3 trial; 205 and 171 people switched from tirzepatide and semaglutide.
  writer:
    - toolCalls:
        - { name: page.get, args: { page: page_weight_loss } }
        - { name: literature.article.get, args: { id: arti_attain_maintain } }
    - toolCalls:
        - name: step.finish
          args:
            outcome: written
            writes:
              body: |-
                Oral GLP-1s give 9 to 13 points more weight loss than placebo, and 7 points in people with type 2 diabetes.

                ## Keeping weight off after injections

                ```table
                {"columns":[{"key":"from","label":"Switched from"},{"key":"drug","label":"Kept on orforglipron"},{"key":"placebo","label":"Kept on placebo"}],"rows":[{"from":"Tirzepatide (205 people)","drug":{"text":"74.7%","quote":{"text":"maintained a model-based estimate (MBE) of 74.7% (s.e.m. 4.05) of body weight reduction with orforglipron","cite":"ATTAIN-MAINTAIN · Aronne LJ et al. Nat Med 2026","href":"https://doi.org/10.1038/s41591-026-04386-7"}},"placebo":"49.2%"},{"from":"Semaglutide (171 people)","drug":{"text":"79.3%","quote":{"text":"79.3% of the weight lost on semaglutide was maintained with orforglipron","cite":"ATTAIN-MAINTAIN · Aronne LJ et al. Nat Med 2026","href":"https://doi.org/10.1038/s41591-026-04386-7"}},"placebo":"37.6%"}]}
                ```
              label: 1 new trial
              change_title: ATTAIN-MAINTAIN added
              plus: after switching from weekly injections, orforglipron kept about three quarters of the weight lost, against 38 to 49% on placebo.
            rationale: ATTAIN-MAINTAIN is the first trial of keeping weight off on a pill after injections.
