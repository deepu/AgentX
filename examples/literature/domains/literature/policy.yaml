policy: literature-domain
effects:
  irreversible: deny           # PubMed is only read; the domain's own records, its pages and the messages it sends are the only writes
budgets:
  tokens: 800000            # a refresh reads 20 to 50 abstracts, and every model call re-reads them
  modelCalls: 60
modelRoles: [searcher, extractor, writer, verifier]
