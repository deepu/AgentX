workflow: client-intake
version: 1
title: Client intake
case: ./case.yaml
policy: ./policy.yaml
start: fill
steps:
  fill:
    on: { submitted: check }
    wait: { remind: 3d, timeout: 7d → needs_person }
  check:
    on:
      checked:      verify
      needs_info:   fill
      failed:       needs_person
      needs_person: needs_person
  verify:
    on: { approved: onboard, sent_back: fill }
    wait: { remind: 1d, timeout: 3d → needs_person }
  onboard: { on: { done: end } }
  needs_person:
    on: { resolved: check }
    wait: { timeout: 7d → end }
