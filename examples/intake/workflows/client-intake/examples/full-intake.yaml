name: full-intake
description: >
  The whole playbook: staff say who the client is and send them a link; once staff approve the
  message, the client fills in the form through it; the check passes; the manager sends the case
  back once (asking for the GST certificate again), so the client gets a second link with that
  comment and fills the form again; the check passes; the manager approves, and onboarding
  writes the customer.
case: {}
submit:
  prepare:
    outcome: send_link
    values:
      client_name: Asha Rao
      client_email: asha@acme-traders.example
      contact_by: email
  fill:
    outcome: submitted
    values:
      client_name: Asha Rao
      client_email: asha@acme-traders.example
      pan: AAACA1234A
      gstin: 29AAACA1234A1Z5
      annual_turnover: { amount: 42000000, currency: INR }
      documents: [pan-card.pdf, gst-certificate.pdf]
  verify:
    - { outcome: sent_back, comment: Please upload a clearer GST certificate. }
    - { outcome: approved }
approvals:
  external.invite: approve
tools:
  gst.validate_gstin: { valid: true, legal_name: Acme Traders Private Limited }
  intake.extract_fields:
    fields:
      - { name: pan, value: AAACA1234A, document: pan-card.pdf, confidence: 0.97 }
      - { name: gstin, value: 29AAACA1234A1Z5, document: gst-certificate.pdf, confidence: 0.95 }
model:
  checker:
    - toolCalls:
        - { name: gst.validate_gstin, args: { gstin: 29AAACA1234A1Z5 } }
        - { name: intake.extract_fields, args: { documents: [pan-card.pdf, gst-certificate.pdf] } }
    - toolCalls:
        - name: step.finish
          args:
            outcome: checked
            writes: { gstin_ok: true, legal_name: Acme Traders Private Limited, flags: [], client_message: "" }
            rationale: The GSTIN is valid and both documents match what the client typed.
  verifier:
    - toolCalls:
        - name: checkpoint.verdict
          args: { results: [ { rule: 1, passed: true, reason: There are no flags. } ] }
expect:
  outcome: send_link
  state: end
  writes: { gstin_ok: true, legal_name: Acme Traders Private Limited, client_name: Asha Rao }
  effects: { external.invite: 2, email.send: 2, domain.customer.create: 1 }
  entities:
    Customer:
      - { name: Asha Rao, gstin: 29AAACA1234A1Z5 }
