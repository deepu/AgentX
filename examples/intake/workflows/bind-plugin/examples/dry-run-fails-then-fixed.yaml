name: dry-run-fails-then-fixed
description: >
  The dry run finds a field mapped onto the wrong type; staff fix the binding, it passes, the
  manager asks once for a stricter class on a tool, staff change it, and it is frozen.
case:
  plugin: memwise/client-intake
submit:
  fix:
    - { outcome: done, comment: Mapped tax_id onto gstin. }
    - { outcome: done, comment: email.send is outbound now. }
  review:
    - { outcome: changes_requested, comment: "Make the email tool outbound, not write." }
    - { outcome: approved }
tools:
  plugins.install_check: { outcome: ok, missing: [], version: 1.0.0, summary: Installed (1.0.0). Requires email_send, provided by memwise/sample-email. }
  plugins.propose_binding: { outcome: classified, draft: memwise__client-intake-binding, unclassified_tools: [], gaps: 1, version: 1.0.0, summary: Client.tax_id has no field of the same type. }
  plugins.dry_run:
    results:
      - { outcome: failed, hash: a1, errors: 1, examples_failed: 0, summary: 1 error to fix. }
      - { outcome: passed, hash: b2, errors: 0, examples_failed: 0, summary: Checks pass; 2 of 2 example cases pass. }
      - { outcome: passed, hash: c3, errors: 0, examples_failed: 0, summary: Checks pass; 2 of 2 example cases pass. }
  plugins.freeze: { outcome: frozen, version: 1 }
  identity.resolve: { linked: 0, candidates: 0, unmatched: 0, created: 0 }
model:
  binder: []                   # the binder is not reached in this case
expect:
  outcome: ok
  state: end
  writes: { checked_hash: c3, binding_version: 1, errors: 0 }
  effects: { plugins.freeze: 1 }
