name: second-reminder
description: >
  Site 101 of MW-301 (Leeds) still owes two start-up documents a week after its first reminder. The
  reminder is drafted to the coordinator, the study manager approves it, it is recorded as the
  site's second reminder, and the site gets 5 days to upload.
records:
  Sponsor:
    - { id: spon_meridian, name: Meridian Pharma }
  Study:
    - { id: stud_mw301, code: MW-301, title: "MW-301: meriglutide once weekly in adults with type 2 diabetes (phase 3)", sponsor: spon_meridian }
  Site:
    - id: site_101
      site_number: "101"
      study: stud_mw301
      status: activating
      cra_name: Priya Shah
      cra_email: priya.shah@northlight.example
  # The coordinator's address is EDC's (read from Rave), followed by the eTMF site through its link.
  edc.Site:
    - { id: edcs_101, site_number: "101", name: Northgate University Hospital, coordinator: Owen Price, coordinator_email: owen.price@site101.example }
  ExpectedDocument:
    - { id: expe_101_cv, site: site_101, study: stud_mw301, artifact: Investigator CV, phase: start_up, status: missing }
    - { id: expe_101_licence, site: site_101, study: stud_mw301, artifact: Medical licence, phase: start_up, status: missing }
    - { id: expe_101_irb, site: site_101, study: stud_mw301, artifact: IRB approval, phase: start_up, status: filed }
  Reminder:
    - { id: remi_101_1, site: site_101, sent_to: owen.price@site101.example, subject: "MW-301: 2 documents needed", sent_at: "2026-10-09T09:00:00Z" }
case:
  site: site_101
model:
  writer:
    - toolCalls:
        - { name: etmf.site.get, args: { id: site_101 } }
        - { name: etmf.expected_document.list, args: { filter: "site = 'site_101' and status = 'missing'" } }
    - toolCalls:
        - name: step.finish
          args:
            outcome: drafted
            writes:
              email_to: owen.price@site101.example
              email_cc: priya.shah@northlight.example
              email_subject: "MW-301: 2 documents needed before the 28 Oct visit"
              email_body: |
                Hello Owen,

                Before Priya's visit on Wed 28 Oct we still need Dr Marsh's CV and her medical
                licence. This is our second reminder.

                Could you upload them by Mon 26 Oct? The link below needs no login.
            rationale: Second reminder; two start-up documents are still missing (the list from the site's expected documents).
submit:
  approve_email: { outcome: approved }
expect:
  outcome: found
  state: wait_for_upload
  writes:
    missing_documents: 2
    reminders_sent: 1
    email_to: owen.price@site101.example
  entities:
    Reminder:
      - { site: site_101 }
      - { site: site_101, sent_to: owen.price@site101.example, subject: "MW-301: 2 documents needed before the 28 Oct visit" }
