workflow: chase-missing
version: 1
title: Chase missing documents
owner: study_manager
# When a site starts activating, ask it for the start-up documents it still owes, then wait for them
# (on the data: however the last one arrives). Nothing after the wait: the study manager calls the site.
start: send_reminder
starts_on:
  - entered: Site.activating
    with: { site: record }
steps:
  send_reminder:
    on: { sent: wait_for_documents }
    wait: { remind: 1d, timeout: 3d → escalate }
  wait_for_documents:
    wait_until: { record: case.site, condition: "start_up_pack_complete = 100%" }
    on: { met: end }
    wait: { timeout: 3d → escalate }
  escalate:
    on: { called: end }
    wait: { remind: 2d, timeout: 14d → end }
