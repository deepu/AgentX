name: sent-back-unsigned
description: >
  QC finds the PI CV isn't signed, so the specialist sends it back with a note: the document is marked
  sent back and "Fix a rejected document" starts with that note.
startAt: qc
records:
  Sponsor:
    - { id: spon_meridian, name: Meridian Pharma }
  Study:
    - { id: stud_mw301, code: MW-301, sponsor: spon_meridian }
  Site:
    - { id: site_101, site_number: "101", study: stud_mw301, status: activating }
  Document:
    - { id: docu_marsh_cv, file: marsh-cv.pdf, artifact: Investigator CV, study: stud_mw301, site: site_101, status: in_qc }
case:
  original: marsh-cv.pdf
  document: docu_marsh_cv
  artifact: Investigator CV
  study: stud_mw301
  site: site_101
submit:
  qc:
    outcome: sent_back
    values:
      qc_comment: The CV isn't signed. Please ask Dr. Marsh to sign and date the last page and send it again.
expect:
  outcome: sent_back
  state: end
  effects: { etmf.document.transition: 1 }
