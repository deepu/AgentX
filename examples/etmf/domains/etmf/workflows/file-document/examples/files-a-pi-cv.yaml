name: files-a-pi-cv
description: >
  Dr. Helen Marsh's CV arrives for site 101 of MW-301. The agent indexes it as the Investigator CV
  that the site's start-up pack still misses, the TMF specialist approves and signs it, and it is
  filed: the expected document is ticked off. The records' ids are the ones Study MW-301's seed gives
  them (projects/mw301/seed.yaml), so the same classification names real records in the walkthrough.
records:
  Sponsor:
    - { id: spon_meridian, name: Meridian Pharma }
  Study:
    - { id: stud_mw301, code: MW-301, title: "MW-301: meriglutide once weekly in adults with type 2 diabetes (phase 3)", sponsor: spon_meridian }
  Site:
    - { id: site_101, site_number: "101", study: stud_mw301, status: activating }
  Person:
    - { id: pers_marsh, name: Helen Marsh, role: Principal Investigator, site: site_101, cv_expires: "2028-10-14" }
  ExpectedDocument:
    - { id: expe_101_cv, site: site_101, study: stud_mw301, artifact: Investigator CV, phase: start_up, status: missing }
case:
  original: marsh-cv.pdf
  sender: owen.price@site101.example
  received_at: "2026-10-20T08:12:00Z"
model:
  classifier:
    - toolCalls:
        - { name: etmf.site.list, args: {} }
    - toolCalls:
        - name: step.finish
          args:
            outcome: classified
            writes:
              artifact: Investigator CV
              study: stud_mw301
              site: site_101
              about: pers_marsh
              document_date: "2026-10-14"
              version: "2026-10"
              expected_document: expe_101_cv
            rationale: >
              A curriculum vitae of Dr. Helen Marsh, Principal Investigator at site 101 (page 1), signed
              and dated 14 Oct 2026 (page 2). Site 101's start-up pack still misses the PI CV.
  verifier:
    - toolCalls:
        - name: checkpoint.verdict
          args:
            results:
              - { rule: 1, passed: true, reason: The Investigator CV is a missing expected document of site 101. }
              - { rule: 2, passed: true, reason: The name and date are on pages 1 and 2; the site number is on page 1. }
submit:
  qc:
    outcome: approved
    values:
      artifact: Investigator CV
      site: site_101
      about: pers_marsh
      document_date: "2026-10-14"
      version: "2026-10"
      qc_comment: Signed and dated on page 2.
expect:
  outcome: done
  state: end
  writes: { artifact: Investigator CV, site: site_101, expected_document: expe_101_cv }
  effects: { etmf.document.create: 1, etmf.document.update: 1, etmf.expected_document.transition: 1 }
  entities:
    Document:
      - { artifact: Investigator CV, site: site_101, about: pers_marsh, fills: expe_101_cv }
